# Brief backend: ONE Worker. /app/* = the built glasses app (static), /api/* = JSON, /connect + /oauth/* = the Google
# sign-in pages. State = ONE D1 database. Deploy steps and secrets: README.md (the CEO deploys, nobody else).
name = "brief"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false
# No usage metrics sent to Cloudflare by the CLI.
send_metrics = false
routes = [ { pattern = "brief.appfinishers.com", custom_domain = true } ]

# The app built by `npm run build` in app/ (job A). The Worker runs first on every request, so /app/<path> is mapped
# to the asset <path> by src/index.ts (serveApp) and nothing is served outside /app/.
[assets]
directory = "../../dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "brief"
# PLACEHOLDER: paste the id printed by `npx wrangler d1 create brief` (README step 2).
database_id = "59814b2f-1b39-49f2-86a0-bf6d512a817b"
migrations_dir = "migrations"

[vars]
# "dev" turns on CORS for http://127.0.0.1:5173 only. Anything else (here: "production") = no CORS at all.
ENV = "production"
# Must match an authorized redirect URI of the Google OAuth client exactly.
OAUTH_REDIRECT_URI = "https://brief.appfinishers.com/oauth/callback"
# Day 3 (BRIEF-D3 § 3.9). The ONE Gmail label the sync reads; the zone of every "HH:MM"; the daily cap of model
# requests (per UTC day, triage and briefs together); the model provider ("openrouter" or "claude").
DEMO_LABEL = "brief-demo"
DISPLAY_TZ = "America/Toronto"
TRIAGE_DAILY_CAP = "30"
MODEL_PROVIDER = "openrouter"
# GOOGLE_TOKEN_URL, GOOGLE_REVOKE_URL, GMAIL_BASE, CALENDAR_BASE, MODEL_BASE: dev only (.dev.vars), ignored unless
# ENV is "dev". Never set them here.

# The sync runs every 2 minutes from the `scheduled` handler (src/index.ts), never from a route.
[triggers]
crons = ["*/2 * * * *"]

# Secrets (never in this file, never typed: piped from a file, README step 3):
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, TOKEN_KEY (base64 of 32 random bytes), ALLOWED_ACCOUNTS (comma-separated)
#   Day 3: OPENROUTER_API_KEY (later ANTHROPIC_API_KEY). Absent = the sync triages nothing; every route still works.
