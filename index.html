<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Brief</title>
  </head>
  <body>
    <p>Brief runs on the glasses. This page is its phone-side WebView.</p>
    <section id="data" aria-labelledby="data-title">
      <h2 id="data-title">On the glasses now</h2>
      <p id="source" role="status" aria-live="polite">Not connected yet.</p>
      <button id="disconnect" type="button" hidden>Disconnect</button>
    </section>
    <form id="pair" hidden autocomplete="off">
      <label for="pair-code">Have a code?</label>
      <input id="pair-code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="123456" required />
      <button type="submit">Pair</button>
      <p id="pair-status" role="status" aria-live="polite"></p>
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
